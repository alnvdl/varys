<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#DDD">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#333">
    <link href="/static/varys.css" rel="stylesheet">
    <link rel="icon" href="/static/icon16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="/static/icon32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/static/icon180.png" sizes="180x180" type="image/png">
    <link rel="apple-touch-icon" href="/static/icon180.png" sizes="180x180" type="image/png">
    <link rel="icon" href="/static/icon.svg" sizes="any" type="image/svg+xml">
    <script src="/static/varys.js"></script>
    <title>Varys</title>
</head>

<body>
    <svg class="icon-sprite" aria-hidden="true" height="0" width="0">
        <symbol id="check-square-icon" height="20px" viewBox="120 -840 720 720" width="20px">
            <path
                d="m424-312 282-282-56-56-226 226-114-114-56 56 170 170ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z" />
        </symbol>
        <symbol id="box-arrow-up-right-icon" height="20px" viewBox="120 -840 720 720" width="20px">
            <path
                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h560v-280h80v280q0 33-23.5 56.5T760-120H200Zm188-212-56-56 372-372H560v-80h280v280h-80v-144L388-332Z" />
        </symbol>
    </svg>

    <div id="controls">
        <div id="controls-container" class="container">
            <nav id="breadcrumbs" aria-label="breadcrumbs">
                <div id="breadcrumb-items" class="breadcrumbs"></div>
            </nav>
            <div id="action-area">
                <a id="read-button">
                    <div class="icon-container">
                        <svg class="icon" fill="currentColor" aria-hidden="true">
                            <use href="#check-square-icon"></use>
                        </svg>
                    </div>
                </a>
                <a id="open-button">
                    <div class="icon-container">
                        <svg class="icon" fill="currentColor" aria-hidden="true">
                            <use href="#box-arrow-up-right-icon"></use>
                        </svg>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div id="content" class="container"></div>

    <main id="desktop-app">
        <section id="desktop-feed-panel" class="desktop-panel">
            <div class="desktop-controls">
                <div class="desktop-control-title">Feeds</div>
                <a id="desktop-all-read-button">
                    <div class="icon-container">
                        <svg class="icon" fill="currentColor" aria-hidden="true">
                            <use href="#check-square-icon"></use>
                        </svg>
                    </div>
                </a>
            </div>
            <div id="desktop-feed-list" class="desktop-panel-content"></div>
        </section>

        <section id="desktop-item-list-panel" class="desktop-panel">
            <div class="desktop-controls">
                <div id="desktop-feed-title" class="desktop-control-title"></div>
                <a id="desktop-feed-read-button">
                    <div class="icon-container">
                        <svg class="icon" fill="currentColor" aria-hidden="true">
                            <use href="#check-square-icon"></use>
                        </svg>
                    </div>
                </a>
            </div>
            <div id="desktop-item-list" class="desktop-panel-content"></div>
        </section>

        <section id="desktop-item-panel" class="desktop-panel">
            <div class="desktop-controls">
                <div id="desktop-item-title" class="desktop-control-title"></div>
                <a id="desktop-open-button" class="hidden">
                    <div class="icon-container">
                        <svg class="icon" fill="currentColor" aria-hidden="true">
                            <use href="#box-arrow-up-right-icon"></use>
                        </svg>
                    </div>
                </a>
            </div>
            <div id="desktop-item-content" class="desktop-panel-content"></div>
        </section>
    </main>

</body>

</html>
